[package]
name = "wow-sync-app"
description = "WoW Sync app: GPUI window, tray, setup and sync status wired to the runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "wow-sync"
path = "src/main.rs"

[[bin]]
name = "devkit"
path = "src/bin/devkit.rs"

[dependencies]
wow-sync-runtime = { version = "0.0.0", path = "../wow-sync-runtime" }
wow-sync-core = { version = "0.0.0", path = "../wow-sync-core" }
gpui = { workspace = true }
gpui_platform = { workspace = true }
tray-icon = { workspace = true }
raw-window-handle = { workspace = true }
