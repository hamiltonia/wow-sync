<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" width="1040" height="720" font-family="Segoe UI, system-ui, sans-serif" font-size="14">
  <title>Wireframe: tray icon states, tray menu, first-close sheet and quit-while-working sheet (light)</title>
  <rect width="1040" height="720" fill="#F5F6F8"/>
  <text x="24" y="36" font-size="18" font-weight="600" fill="#1A1F29">Tray, close and quit</text>
  <!-- tray icon states -->
  <text x="24" y="72" font-weight="600" fill="#1A1F29">Tray icon: base mark + state overlay (shape, not only colour)</text>
  <g font-size="12" fill="#4A5363">
    <rect x="24" y="88" width="32" height="32" rx="6" fill="#1A1F29"/><circle cx="50" cy="114" r="7" fill="#17703A"/><text x="40" y="140" text-anchor="middle">Up to date</text>
    <rect x="124" y="88" width="32" height="32" rx="6" fill="#1A1F29"/><circle cx="150" cy="114" r="7" fill="none" stroke="#1D5BBF" stroke-width="3" stroke-dasharray="8 4"/><text x="140" y="140" text-anchor="middle">Syncing</text>
    <rect x="224" y="88" width="32" height="32" rx="6" fill="#1A1F29"/><path d="M243 106 h14 l-7 8 l7 8 h-14 l7 -8 z" fill="none" stroke="#F2C14E" stroke-width="2"/><text x="240" y="140" text-anchor="middle">Waiting</text>
    <rect x="324" y="88" width="32" height="32" rx="6" fill="#1A1F29"/><path d="M350 105 l8 15 h-16 z" fill="#A64205"/><text x="340" y="140" text-anchor="middle">Needs help</text>
    <rect x="424" y="88" width="32" height="32" rx="6" fill="#1A1F29"/><path d="M444 108 l12 12 M456 108 l-12 12" stroke="#B42318" stroke-width="3"/><text x="440" y="140" text-anchor="middle">Error</text>
    <rect x="524" y="88" width="32" height="32" rx="6" fill="#1A1F29"/><rect x="543" y="107" width="4" height="13" fill="#6941C6"/><rect x="551" y="107" width="4" height="13" fill="#6941C6"/><text x="540" y="140" text-anchor="middle">Paused</text>
  </g>
  <text x="24" y="168" font-size="12" fill="#4A5363">Tooltip: "WoW Sync: &lt;headline&gt;", e.g. "WoW Sync: Waiting, WoW is running". Windows: left click opens window, right click menu (Q-39).</text>
  <!-- tray menu -->
  <text x="24" y="210" font-weight="600" fill="#1A1F29">Tray menu</text>
  <rect x="24" y="222" width="280" height="218" rx="4" fill="#FFFFFF" stroke="#7D8799"/>
  <text x="40" y="250" fill="#4A5363">Waiting for your decision on 2 add-ons</text>
  <line x1="32" y1="262" x2="296" y2="262" stroke="#7D8799" stroke-width="0.5"/>
  <text x="40" y="288" fill="#1A1F29">Open WoW Sync</text>
  <text x="40" y="320" fill="#1A1F29">Sync now</text>
  <text x="40" y="352" fill="#1A1F29">Pause syncing</text>
  <text x="40" y="384" fill="#1A1F29">Needs attention (2)…</text>
  <line x1="32" y1="398" x2="296" y2="398" stroke="#7D8799" stroke-width="0.5"/>
  <text x="40" y="424" fill="#1A1F29">Quit WoW Sync</text>
  <text x="24" y="462" font-size="12" fill="#4A5363">Paused: item reads "Resume syncing"; "Sync now" disabled.</text>
  <text x="24" y="480" font-size="12" fill="#4A5363">"Needs attention" only when N &gt; 0.</text>
  <!-- first close sheet -->
  <text x="352" y="210" font-weight="600" fill="#1A1F29">First close (shown once)</text>
  <rect x="352" y="222" width="320" height="218" rx="8" fill="#FFFFFF" stroke="#7D8799"/>
  <text x="372" y="254" font-size="16" font-weight="600" fill="#1A1F29">WoW Sync keeps running</text>
  <text x="372" y="284" fill="#1A1F29">WoW Sync keeps running in the tray</text>
  <text x="372" y="304" fill="#1A1F29">and keeps your add-ons in sync.</text>
  <text x="372" y="334" fill="#1A1F29">To stop it, choose Quit WoW Sync</text>
  <text x="372" y="354" fill="#1A1F29">from the tray menu.</text>
  <rect x="372" y="388" width="124" height="32" rx="4" fill="#1D5BBF"/>
  <text x="434" y="409" text-anchor="middle" fill="#FFFFFF">Hide window</text>
  <rect x="508" y="388" width="144" height="32" rx="4" fill="#FFFFFF" stroke="#7D8799"/>
  <text x="580" y="409" text-anchor="middle" fill="#1A1F29">Quit WoW Sync</text>
  <rect x="370" y="386" width="128" height="36" rx="6" fill="none" stroke="#1D5BBF" stroke-width="2"/>
  <!-- quit while working -->
  <text x="704" y="210" font-weight="600" fill="#1A1F29">Quit while updating</text>
  <rect x="704" y="222" width="320" height="218" rx="8" fill="#FFFFFF" stroke="#7D8799"/>
  <text x="724" y="254" font-size="16" font-weight="600" fill="#1A1F29">Quit WoW Sync?</text>
  <text x="724" y="284" fill="#1A1F29">WoW Sync is updating</text>
  <text x="724" y="304" fill="#1A1F29">Deadly Boss Mods. Quitting waits for</text>
  <text x="724" y="324" fill="#1A1F29">the current step to finish safely.</text>
  <text x="724" y="354" font-size="12" fill="#4A5363">Start when I sign in stays on.</text>
  <rect x="724" y="388" width="132" height="32" rx="4" fill="#1D5BBF"/>
  <text x="790" y="409" text-anchor="middle" fill="#FFFFFF">Quit when safe</text>
  <rect x="868" y="388" width="132" height="32" rx="4" fill="#FFFFFF" stroke="#7D8799"/>
  <text x="934" y="409" text-anchor="middle" fill="#1A1F29">Keep running</text>
  <!-- pause banner -->
  <text x="24" y="530" font-weight="600" fill="#1A1F29">Paused banner (window, below header)</text>
  <rect x="24" y="542" width="1000" height="56" rx="4" fill="#FFFFFF" stroke="#6941C6" stroke-width="1.5"/>
  <rect x="40" y="560" width="5" height="20" fill="#6941C6"/><rect x="49" y="560" width="5" height="20" fill="#6941C6"/>
  <text x="68" y="575" fill="#1A1F29">Syncing is paused on this computer. Updates from other computers are not applied here, and changes here are not shared.</text>
  <rect x="890" y="554" width="124" height="32" rx="4" fill="#1D5BBF"/>
  <text x="952" y="575" text-anchor="middle" fill="#FFFFFF">Resume syncing</text>
  <text x="24" y="630" font-size="12" fill="#4A5363">Sheets are in-content overlays (no stock dialog in GPUI, Q-33). Close = hide (Q-26); pause persists (Q-28); quit waits for a safe point (Q-29, UG-17).</text>
</svg>
