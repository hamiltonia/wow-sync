  <rect x="912" y="16" width="100" height="32" rx="4" fill="#FFFFFF" stroke="#7D8799"/>
  <text x="962" y="37" text-anchor="middle" fill="#1A1F29">Pause</text>
  <!-- sidebar -->
  <rect x="0" y="64" width="200" height="656" fill="#EBEEF2"/>
  <text x="20" y="40" font-size="16" font-weight="600" fill="#1A1F29">WoW Sync</text>
  <rect x="8" y="80" width="184" height="36" rx="4" fill="#DCE6F7"/>
  <rect x="8" y="80" width="4" height="36" fill="#1D5BBF"/>
  <text x="24" y="103" font-weight="600" fill="#1A1F29">Overview</text>
  <text x="24" y="143" fill="#1A1F29">Computers</text>
  <text x="24" y="179" fill="#1A1F29">Add-ons</text>
  <text x="170" y="179" text-anchor="end" fill="#4A5363">42</text>
  <text x="24" y="215" fill="#1A1F29">Needs attention</text>
  <text x="24" y="251" fill="#1A1F29">Activity</text>
  <line x1="16" y1="270" x2="184" y2="270" stroke="#7D8799" stroke-width="0.5"/>
  <text x="24" y="295" fill="#1A1F29">Settings sync</text>
  <text x="24" y="315" font-size="12" fill="#4A5363">Coming later</text>
  <text x="24" y="351" fill="#1A1F29">App settings</text>
  <text x="24" y="387" fill="#1A1F29">About</text>
  <!-- left column: this computer -->
  <rect x="224" y="88" width="388" height="200" rx="6" fill="#FFFFFF" stroke="#7D8799" stroke-width="0.5"/>
  <text x="244" y="116" font-size="16" font-weight="600" fill="#1A1F29">This computer: Desk PC</text>
  <text x="244" y="144" fill="#1A1F29">42 add-ons in the group</text>
  <text x="244" y="168" fill="#17703A">✓ 41 up to date</text>
  <text x="244" y="192" fill="#17703A">✓ 1 applied here, not confirmed yet</text>
  <text x="244" y="216" fill="#4A5363">2 add-ons here are not synced (not in the group)</text>
  <text x="244" y="248" fill="#4A5363">Installation: World of Warcraft Forever (_classic_era_)</text>
  <text x="244" y="270" fill="#1D5BBF" text-decoration="underline">View add-ons</text>
  <!-- left column: recent changes -->
  <rect x="224" y="304" width="388" height="240" rx="6" fill="#FFFFFF" stroke="#7D8799" stroke-width="0.5"/>
  <text x="244" y="332" font-size="16" font-weight="600" fill="#1A1F29">Recent changes</text>
  <text x="244" y="362" fill="#1A1F29">Today 20:41 · 3 add-ons updated from Laptop</text>
  <text x="244" y="382" font-size="12" fill="#4A5363">Deadly Boss Mods, Details!, WeakAuras</text>
  <text x="244" y="414" fill="#1A1F29">Yesterday 18:02 · 1 add-on added from Laptop</text>
  <text x="244" y="434" font-size="12" fill="#4A5363">Bagnon</text>
  <text x="244" y="466" fill="#1A1F29">Mon 12 May · This computer joined Main add-ons</text>
  <text x="244" y="522" fill="#1D5BBF" text-decoration="underline">All activity</text>
  <!-- right column: other computers -->
  <rect x="628" y="88" width="388" height="200" rx="6" fill="#FFFFFF" stroke="#7D8799" stroke-width="0.5"/>
  <text x="648" y="116" font-size="16" font-weight="600" fill="#1A1F29">Other computers</text>
  <circle cx="656" cy="146" r="6" fill="#17703A"/>
  <text x="672" y="151" fill="#1A1F29">Laptop</text>
  <text x="996" y="151" text-anchor="end" fill="#4A5363">reported 5 minutes ago</text>
  <text x="672" y="173" font-size="12" fill="#4A5363">Last confirmed 41 of 42 add-ons</text>
  <text x="648" y="214" font-size="12" fill="#4A5363">Each computer shows what it last confirmed.</text>
  <text x="648" y="232" font-size="12" fill="#4A5363">What it has right now is only known when it reports.</text>
  <text x="648" y="270" fill="#1D5BBF" text-decoration="underline">View computers</text>
  <!-- right column: needs attention -->
  <rect x="628" y="304" width="388" height="120" rx="6" fill="#FFFFFF" stroke="#7D8799" stroke-width="0.5"/>
  <text x="648" y="332" font-size="16" font-weight="600" fill="#1A1F29">Needs attention</text>
  <text x="648" y="362" fill="#4A5363">Nothing needs your attention.</text>
  <!-- right column: dropbox -->
  <rect x="628" y="440" width="388" height="104" rx="6" fill="#FFFFFF" stroke="#7D8799" stroke-width="0.5"/>
  <text x="648" y="468" font-size="16" font-weight="600" fill="#1A1F29">Shared folder</text>
  <text x="648" y="496" fill="#1A1F29">Dropbox · WoW Sync folder · readable</text>
  <text x="648" y="520" font-size="12" fill="#4A5363">Publishing to Dropbox does not mean other computers applied it.</text>
  <!-- annotations -->
  <text x="224" y="600" font-size="12" fill="#4A5363">Wireframe, not a pixel design. Tokens: style.md (light). Two columns at content width ≥ 820 px; one column below.</text>
  <text x="224" y="620" font-size="12" fill="#4A5363">Headline is about THIS computer only; other computers always show last report time (A-24, UG-22).</text>
</svg>
