<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" width="1040" height="720" font-family="Segoe UI, system-ui, sans-serif" font-size="14">
  <title>Wireframe: setup wizard, step 4 "Confirm game version and add-ons" for an unfamiliar client (light)</title>
  <rect width="1040" height="720" fill="#F5F6F8"/>
  <rect x="0" y="0" width="1040" height="64" fill="#FFFFFF" stroke="#7D8799" stroke-width="0.5"/>
  <text x="24" y="40" font-size="18" font-weight="600" fill="#1A1F29">Set up WoW Sync</text>
  <text x="1016" y="40" text-anchor="end" fill="#4A5363">Step 4 of 6</text>
  <!-- step indicator -->
  <g font-size="12">
    <circle cx="160" cy="96" r="8" fill="#17703A"/><text x="160" y="120" text-anchor="middle" fill="#4A5363">Welcome</text>
    <line x1="168" y1="96" x2="292" y2="96" stroke="#7D8799"/>
    <circle cx="300" cy="96" r="8" fill="#17703A"/><text x="300" y="120" text-anchor="middle" fill="#4A5363">Shared folder</text>
    <line x1="308" y1="96" x2="432" y2="96" stroke="#7D8799"/>
    <circle cx="440" cy="96" r="8" fill="#17703A"/><text x="440" y="120" text-anchor="middle" fill="#4A5363">Installation</text>
    <line x1="448" y1="96" x2="572" y2="96" stroke="#7D8799"/>
    <circle cx="580" cy="96" r="9" fill="#1D5BBF"/><text x="580" y="120" text-anchor="middle" font-weight="600" fill="#1A1F29">Confirm</text>
    <line x1="588" y1="96" x2="712" y2="96" stroke="#7D8799"/>
    <circle cx="720" cy="96" r="8" fill="none" stroke="#7D8799" stroke-width="2"/><text x="720" y="120" text-anchor="middle" fill="#4A5363">Sync group</text>
    <line x1="728" y1="96" x2="852" y2="96" stroke="#7D8799"/>
    <circle cx="860" cy="96" r="8" fill="none" stroke="#7D8799" stroke-width="2"/><text x="860" y="120" text-anchor="middle" fill="#4A5363">Name</text>
  </g>
  <rect x="120" y="140" width="800" height="500" rx="6" fill="#FFFFFF" stroke="#7D8799" stroke-width="0.5"/>
  <text x="144" y="174" font-size="18" font-weight="600" fill="#1A1F29">Confirm the game version and add-ons</text>
  <path d="M152 192 l9 16 h-18 z" fill="#A64205"/>
  <text x="172" y="206" fill="#1A1F29">WoW Sync does not recognise this game version yet. Check that the details below are right.</text>
  <text x="144" y="242" font-weight="600" fill="#1A1F29">Game installation</text>
  <text x="144" y="264" fill="#1A1F29">Folder _anniversary_ · build 1.15.8 · reported product "wow_anniversary"</text>
  <text x="144" y="284" fill="#4A5363">This is treated as its own game version; it will only sync with the same version.</text>
  <text x="144" y="320" font-weight="600" fill="#1A1F29">Add-ons that will sync (38)</text>
  <text x="144" y="342" fill="#1A1F29">Bagnon, Deadly Boss Mods, Details!, Questie, WeakAuras, … Show all</text>
  <text x="144" y="372" font-weight="600" fill="#1A1F29">Will not sync (2)</text>
  <text x="144" y="394" fill="#1A1F29">ExampleAddon: has game-version-specific files WoW Sync does not handle yet</text>
  <text x="144" y="430" font-weight="600" fill="#1A1F29">What syncing does</text>
  <text x="144" y="452" fill="#4A5363">Replaced add-ons are kept as recovery copies. Nothing changes while WoW is running.</text>
  <!-- checkboxes -->
  <rect x="144" y="482" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#7D8799" stroke-width="1.5"/>
  <text x="174" y="496" fill="#1A1F29">This is the game version shown above</text>
  <rect x="142" y="480" width="22" height="22" rx="4" fill="none" stroke="#1D5BBF" stroke-width="2"/>
  <rect x="144" y="516" width="18" height="18" rx="3" fill="#1D5BBF"/>
  <path d="M148 525 l4 4 l7 -8" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <text x="174" y="530" fill="#1A1F29">Sync the add-ons listed above for this installation</text>
  <text x="144" y="562" font-size="12" fill="#A64205">Confirm both to continue. Agreeing to the add-on list alone is not enough for an unrecognised game version.</text>
  <rect x="680" y="588" width="100" height="32" rx="4" fill="#FFFFFF" stroke="#7D8799"/>
  <text x="730" y="609" text-anchor="middle" fill="#1A1F29">Back</text>
  <rect x="796" y="588" width="100" height="32" rx="4" fill="#EBEEF2" stroke="#7D8799"/>
  <text x="846" y="609" text-anchor="middle" fill="#4A5363">Continue</text>
  <text x="120" y="672" font-size="12" fill="#4A5363">Continue disabled until both are checked (A-46). Refused layout: problem sentence, no checkboxes, no Continue. Nothing is written before "Set up this computer" (step 6).</text>
  <text x="120" y="692" font-size="12" fill="#4A5363">Data from EnrollPreview (identity_line, scope_line, eligible, blocked, disclosures, needs_guided_confirmation). Fictional example values.</text>
</svg>
