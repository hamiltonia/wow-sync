<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" width="1040" height="720" font-family="Segoe UI, system-ui, sans-serif" font-size="14">
  <title>Wireframe: Computers list page (scenario S9, silent and late computers, light). Follows screens.md Computers layout; the detail page replaces this list.</title>
  <rect width="1040" height="720" fill="#F5F6F8"/>
  <!-- header (same on every page) -->
  <rect x="0" y="0" width="1040" height="64" fill="#FFFFFF" stroke="#7D8799" stroke-width="0.5"/>
  <text x="20" y="40" font-size="16" font-weight="600" fill="#1A1F29">WoW Sync</text>
  <circle cx="232" cy="32" r="11" fill="#17703A"/><path d="M226 32 l4 4 l8 -8" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
  <text x="252" y="29" font-size="18" font-weight="600" fill="#1A1F29">This computer is up to date</text>
  <text x="252" y="49" fill="#4A5363">World of Warcraft: Forever (wowf) · "Main add-ons" group · this computer: Desk PC</text>
  <rect x="800" y="16" width="100" height="32" rx="4" fill="#1D5BBF"/>
  <text x="850" y="37" text-anchor="middle" fill="#FFFFFF">Sync now</text>
  <rect x="912" y="16" width="100" height="32" rx="4" fill="#FFFFFF" stroke="#7D8799"/>
  <text x="962" y="37" text-anchor="middle" fill="#1A1F29">Pause</text>
  <!-- sidebar -->
  <rect x="0" y="64" width="200" height="656" fill="#EBEEF2"/>
  <text x="24" y="103" fill="#1A1F29">Overview</text>
  <rect x="8" y="116" width="184" height="36" rx="4" fill="#DCE6F7"/><rect x="8" y="116" width="4" height="36" fill="#1D5BBF"/>
  <text x="24" y="139" font-weight="600" fill="#1A1F29">Computers</text>
  <text x="24" y="179" fill="#1A1F29">Add-ons</text>
  <text x="24" y="215" fill="#1A1F29">Needs attention</text>
  <text x="24" y="251" fill="#1A1F29">Activity</text>
  <line x1="16" y1="270" x2="184" y2="270" stroke="#7D8799" stroke-width="0.5"/>
  <text x="24" y="295" fill="#1A1F29">Settings sync</text>
  <text x="24" y="315" font-size="12" fill="#4A5363">Coming later</text>
  <text x="24" y="351" fill="#1A1F29">App settings</text>
  <text x="24" y="387" fill="#1A1F29">About</text>
  <!-- page title -->
  <text x="224" y="100" font-size="18" font-weight="600" fill="#1A1F29">Computers in Main add-ons</text>
  <text x="224" y="122" font-size="12" fill="#4A5363">Based on each computer's last report. What a computer has right now is not known until it reports.</text>
  <!-- list: one column, full content width -->
  <rect x="224" y="136" width="792" height="372" rx="6" fill="#FFFFFF" stroke="#7D8799" stroke-width="0.5"/>
  <text x="244" y="162" font-size="12" font-weight="600" fill="#4A5363">Name</text>
  <text x="440" y="162" font-size="12" font-weight="600" fill="#4A5363">Last report received here</text>
  <text x="640" y="162" font-size="12" font-weight="600" fill="#4A5363">Last confirmed</text>
  <text x="840" y="162" font-size="12" font-weight="600" fill="#4A5363">Status</text>
  <line x1="232" y1="174" x2="1008" y2="174" stroke="#7D8799" stroke-width="0.5"/>
  <!-- this computer -->
  <circle cx="250" cy="198" r="6" fill="#17703A"/>
  <text x="264" y="203" font-weight="600" fill="#1A1F29">Desk PC</text>
  <text x="264" y="221" font-size="12" fill="#4A5363">This computer</text>
  <text x="440" y="203" fill="#1A1F29">now</text>
  <text x="640" y="203" fill="#1A1F29">42 of 42 current add-ons</text>
  <text x="840" y="203" fill="#17703A">Up to date</text>
  <line x1="232" y1="236" x2="1008" y2="236" stroke="#7D8799" stroke-width="0.5"/>
  <!-- laptop -->
  <circle cx="250" cy="260" r="6" fill="#17703A"/>
  <text x="264" y="265" fill="#1A1F29">Laptop</text>
  <text x="440" y="265" fill="#1A1F29">5 min ago</text>
  <text x="640" y="265" fill="#1A1F29">42 of 42 current add-ons</text>
  <text x="840" y="265" fill="#17703A">Report received</text>
  <line x1="232" y1="290" x2="1008" y2="290" stroke="#7D8799" stroke-width="0.5"/>
  <!-- den pc, stale, selected row with keyboard focus ring -->
  <rect x="228" y="294" width="784" height="62" rx="4" fill="#DCE6F7"/>
  <rect x="226" y="292" width="788" height="66" rx="6" fill="none" stroke="#1D5BBF" stroke-width="2"/>
  <circle cx="250" cy="316" r="7" fill="none" stroke="#4A5363" stroke-width="2"/><path d="M250 311 v5 h4" stroke="#4A5363" stroke-width="1.5" fill="none"/>
  <text x="264" y="321" font-weight="600" fill="#1A1F29">Den PC</text>
  <text x="440" y="321" font-weight="600" fill="#1A1F29">12 days ago</text>
  <text x="640" y="321" fill="#1A1F29">40 of 42 current add-ons</text>
  <text x="840" y="321" font-weight="600" fill="#4A5363">Not heard from for 12 days</text>
  <text x="264" y="342" font-size="12" fill="#4A5363">What it has now is not known.</text>
  <line x1="232" y1="360" x2="1008" y2="360" stroke="#7D8799" stroke-width="0.5"/>
  <!-- spare pc -->
  <circle cx="250" cy="384" r="6" fill="none" stroke="#4A5363" stroke-width="2"/>
  <text x="264" y="389" fill="#1A1F29">Spare PC</text>
  <text x="440" y="389" fill="#4A5363">never</text>
  <text x="640" y="389" fill="#4A5363">nothing yet</text>
  <text x="840" y="389" fill="#4A5363">Has not shared anything yet</text>
  <line x1="232" y1="414" x2="1008" y2="414" stroke="#7D8799" stroke-width="0.5"/>
  <!-- old pc -->
  <path d="M244 450 l6 -12 l6 12 z" fill="#A64205"/>
  <text x="264" y="449" fill="#1A1F29">Old PC</text>
  <text x="440" y="449" fill="#1A1F29">2 days ago</text>
  <text x="640" y="449" fill="#4A5363">ignored</text>
  <text x="840" y="449" fill="#A64205">Needs help</text>
  <text x="264" y="470" font-size="12" fill="#4A5363">Its report went backwards and was ignored.</text>
  <!-- annotations -->
  <text x="224" y="560" font-size="12" fill="#4A5363">Activating a row opens Computer detail, which replaces this list (Back returns). List and detail are never side by side.</text>
  <text x="224" y="580" font-size="12" fill="#4A5363">Never "all computers are up to date". "Not heard from" emphasis threshold: Q-27; age always shown (A-24, UG-5, UG-6).</text>
  <text x="224" y="600" font-size="12" fill="#4A5363">Wireframe; screens.md prose is authoritative. Keyboard focus ring shown on the Den PC row.</text>
</svg>
