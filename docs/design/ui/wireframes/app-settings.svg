<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" width="1040" height="720" font-family="Segoe UI, system-ui, sans-serif" font-size="14">
  <title>Wireframe: App settings (light)</title>
  <rect width="1040" height="720" fill="#F5F6F8"/>
  <rect x="0" y="0" width="1040" height="64" fill="#FFFFFF" stroke="#7D8799" stroke-width="0.5"/>
  <text x="20" y="40" font-size="16" font-weight="600" fill="#1A1F29">WoW Sync</text>
  <circle cx="232" cy="32" r="11" fill="#17703A"/><path d="M226 32 l4 4 l8 -8" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
  <text x="252" y="29" font-size="18" font-weight="600" fill="#1A1F29">This computer is up to date</text>
  <text x="252" y="49" fill="#4A5363">World of Warcraft: Forever (wowf) · "Main add-ons" group · this computer: Desk PC</text>
  <rect x="800" y="16" width="100" height="32" rx="4" fill="#1D5BBF"/><text x="850" y="37" text-anchor="middle" fill="#FFFFFF">Sync now</text>
  <rect x="912" y="16" width="100" height="32" rx="4" fill="#FFFFFF" stroke="#7D8799"/><text x="962" y="37" text-anchor="middle" fill="#1A1F29">Pause</text>
  <rect x="0" y="64" width="200" height="656" fill="#EBEEF2"/>
  <text x="24" y="103" fill="#1A1F29">Overview</text>
  <text x="24" y="139" fill="#1A1F29">Computers</text>
  <text x="24" y="175" fill="#1A1F29">Add-ons</text>
  <text x="24" y="211" fill="#1A1F29">Needs attention</text>
  <text x="24" y="247" fill="#1A1F29">Activity</text>
  <line x1="16" y1="270" x2="184" y2="270" stroke="#7D8799" stroke-width="0.5"/>
  <text x="24" y="295" fill="#1A1F29">Settings sync</text>
  <rect x="8" y="328" width="184" height="36" rx="4" fill="#DCE6F7"/><rect x="8" y="328" width="4" height="36" fill="#1D5BBF"/>
  <text x="24" y="351" font-weight="600" fill="#1A1F29">App settings</text>
  <text x="24" y="387" fill="#1A1F29">About</text>
  <text x="224" y="100" font-size="18" font-weight="600" fill="#1A1F29">App settings</text>
  <!-- startup -->
  <rect x="224" y="116" width="388" height="120" rx="6" fill="#FFFFFF" stroke="#7D8799" stroke-width="0.5"/>
  <text x="244" y="144" font-weight="600" fill="#1A1F29">Startup</text>
  <rect x="244" y="160" width="36" height="20" rx="10" fill="#1D5BBF"/><circle cx="270" cy="170" r="7" fill="#FFFFFF"/>
  <text x="292" y="175" fill="#1A1F29">Start WoW Sync when I sign in · On</text>
  <rect x="244" y="196" width="36" height="20" rx="10" fill="#1D5BBF"/><circle cx="270" cy="206" r="7" fill="#FFFFFF"/>
  <text x="292" y="211" fill="#1A1F29">Start hidden in the tray · On</text>
  <!-- syncing -->
  <rect x="628" y="116" width="388" height="120" rx="6" fill="#FFFFFF" stroke="#7D8799" stroke-width="0.5"/>
  <text x="648" y="144" font-weight="600" fill="#1A1F29">Syncing</text>
  <text x="648" y="170" fill="#1A1F29">Syncing is on.</text>
  <rect x="648" y="186" width="120" height="32" rx="4" fill="#FFFFFF" stroke="#7D8799"/><text x="708" y="207" text-anchor="middle" fill="#1A1F29">Pause syncing</text>
  <rect x="780" y="186" width="100" height="32" rx="4" fill="#FFFFFF" stroke="#7D8799"/><text x="830" y="207" text-anchor="middle" fill="#1A1F29">Sync now</text>
  <!-- appearance -->
  <rect x="224" y="252" width="388" height="110" rx="6" fill="#FFFFFF" stroke="#7D8799" stroke-width="0.5"/>
  <text x="244" y="280" font-weight="600" fill="#1A1F29">Appearance</text>
  <text x="244" y="304" fill="#1A1F29">Theme</text>
  <rect x="300" y="290" width="130" height="30" rx="4" fill="#1D5BBF"/><text x="365" y="310" text-anchor="middle" fill="#FFFFFF">Follow system</text>
  <rect x="430" y="290" width="70" height="30" fill="#FFFFFF" stroke="#7D8799"/><text x="465" y="310" text-anchor="middle" fill="#1A1F29">Light</text>
  <rect x="500" y="290" width="70" height="30" rx="0" fill="#FFFFFF" stroke="#7D8799"/><text x="535" y="310" text-anchor="middle" fill="#1A1F29">Dark</text>
  <text x="244" y="344" font-size="12" fill="#4A5363">Changes apply immediately (Q-34, Q-35).</text>
  <!-- notifications -->
  <rect x="628" y="252" width="388" height="110" rx="6" fill="#FFFFFF" stroke="#7D8799" stroke-width="0.5"/>
  <text x="648" y="280" font-weight="600" fill="#1A1F29">Notifications</text>
  <rect x="648" y="292" width="36" height="20" rx="10" fill="#1D5BBF"/><circle cx="674" cy="302" r="7" fill="#FFFFFF"/>
  <text x="696" y="307" fill="#1A1F29">Show a summary after each sync</text>
  <rect x="648" y="320" width="36" height="20" rx="10" fill="#1D5BBF"/><circle cx="674" cy="330" r="7" fill="#FFFFFF"/>
  <text x="696" y="335" fill="#1A1F29">Tell me when something needs me</text>
  <text x="648" y="354" font-size="11" fill="#4A5363">Wait while WoW runs, except problems that risk your data.</text>
  <!-- window / privacy -->
  <rect x="224" y="378" width="388" height="110" rx="6" fill="#FFFFFF" stroke="#7D8799" stroke-width="0.5"/>
  <text x="244" y="406" font-weight="600" fill="#1A1F29">Window</text>
  <rect x="244" y="422" width="290" height="32" rx="4" fill="#FFFFFF" stroke="#7D8799"/><text x="389" y="443" text-anchor="middle" fill="#1A1F29">Explain close-to-tray again next time</text>
  <rect x="628" y="378" width="388" height="110" rx="6" fill="#FFFFFF" stroke="#7D8799" stroke-width="0.5"/>
  <text x="648" y="406" font-weight="600" fill="#1A1F29">Privacy</text>
  <rect x="648" y="420" width="36" height="20" rx="10" fill="#EBEEF2" stroke="#7D8799"/><circle cx="658" cy="430" r="7" fill="#7D8799"/>
  <text x="696" y="435" fill="#4A5363">Send anonymous crash reports · Coming later</text>
  <text x="696" y="462" font-size="13" fill="#1D5BBF" text-decoration="underline">What is sent?</text>
  <!-- data / quit -->
  <rect x="224" y="504" width="792" height="110" rx="6" fill="#FFFFFF" stroke="#7D8799" stroke-width="0.5"/>
  <text x="244" y="532" font-weight="600" fill="#1A1F29">Data</text>
  <text x="244" y="556" font-size="13" fill="#1A1F29">Shared folder: Dropbox\WoW Sync</text><text x="560" y="556" font-size="13" fill="#1D5BBF" text-decoration="underline">Open</text>
  <text x="244" y="580" font-size="13" fill="#1A1F29">Local data: AppData\Local\WoW Sync</text><text x="560" y="580" font-size="13" fill="#1D5BBF" text-decoration="underline">Open</text>
  <rect x="640" y="548" width="170" height="32" rx="4" fill="#EBEEF2" stroke="#7D8799"/><text x="725" y="569" text-anchor="middle" fill="#4A5363">Export diagnostics…</text>
  <rect x="860" y="548" width="136" height="32" rx="4" fill="#FFFFFF" stroke="#B42318"/><text x="928" y="569" text-anchor="middle" fill="#B42318">Quit WoW Sync</text>
  <text x="224" y="650" font-size="12" fill="#4A5363">Toggles are role Switch (fallback: CheckBox) with on/off in the name (interaction.md). OS start-at-sign-in is runtime work (UG-23); faked in the prototype.</text>
  <text x="224" y="670" font-size="12" fill="#4A5363">Theme buttons form one group: Left/Right move, Space selects.</text>
</svg>
