[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
rust-version = "1.100.0"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
getrandom = "=0.3.4"
windows-sys = "=0.59.0"
# GPUI is pinned to the Zed v1.28.1 release tag commit (R2-pin). `version` satisfies the
# wildcard ban for git sources.
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
gpui_platform = { version = "0.1.0", git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
tray-icon = "=0.26.1"
raw-window-handle = "0.6"
# Same versions as already in Cargo.lock (png via tray-icon/image; embed-resource via GPUI).
png = "=0.18.1"
embed-resource = "=3.0.12"
