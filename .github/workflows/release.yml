name: release

# A pushed `v*` tag builds, verifies and publishes a GitHub pre-release (D-26).
# workflow_dispatch builds and uploads the artifact only; it never publishes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: 0.20.2

jobs:
  build:
    name: build windows-x64
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.meta.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --profile minimal
          rustc --version --verbose
          cargo --version
      - name: Install cargo-deny (pinned)
        run: cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
      - name: Read workspace version
        id: meta
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\([0-9][0-9.]*\)".*/\1/p}' Cargo.toml | head -n1)
          if [ -z "$version" ]; then echo "workspace version not found" >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Offline verification tier
        run: cargo xtask verify --tier offline
      - name: Native verification tier
        run: cargo xtask verify --tier native
      - name: Release build
        env:
          WOWSYNC_BUILD_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked -p wow-sync-app --bin wow-sync
      - name: Package zip and SHA-256
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "wow-sync-$env:VERSION-windows-x64"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item target/release/wow-sync.exe $stage
          Copy-Item README.md $stage
          Copy-Item "docs/release/v$env:VERSION.md" (Join-Path $stage 'RELEASE-NOTES.md')
          Get-ChildItem -Path . -Maxdepth 1 -File -Filter 'LICENSE*' | Copy-Item -Destination $stage
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Resolve-Path dist) "$name.zip.sha256"), "$hash  $name.zip`n")
          Get-ChildItem dist | Format-Table Name, Length
      - name: Upload artifact
        # SHA for v4.6.2; verify against the action's release page before the first tag.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wow-sync-${{ steps.meta.outputs.version }}-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Show verification report
        if: always()
        run: cat target/verify/report.json || true

  publish:
    name: publish pre-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must equal v + workspace version
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "tag $TAG does not match workspace version v$VERSION" >&2
            exit 1
          fi
          test -f "docs/release/$TAG.md"
      - name: Download artifact
        # SHA for v4.3.0; verify against the action's release page before the first tag.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wow-sync-${{ needs.build.outputs.version }}-windows-x64
          path: dist
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "WoW Sync $TAG (pre-release)" \
            --notes-file "docs/release/$TAG.md"
