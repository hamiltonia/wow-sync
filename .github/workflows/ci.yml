name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: 0.20.2

jobs:
  verify-offline:
    name: verify-offline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --profile minimal
          rustc --version --verbose
          cargo --version
      - name: Install cargo-deny (pinned)
        run: cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
      - name: Offline verification tier
        run: cargo xtask verify --tier offline
      - name: Show verification report
        if: always()
        run: cat target/verify/report.json || true

  build-targets:
    name: build-only ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --profile minimal
          rustc --version --verbose
      - name: Build-only (compile check; nothing is run or uploaded)
        run: cargo build --workspace --locked --target "${{ matrix.target }}"
