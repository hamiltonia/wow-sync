name: spike-gpui

# Build-only feasibility spike (run-001 S-gpui). Nothing is run or uploaded.
on:
  workflow_dispatch:
  push:
    paths:
      - "spikes/gpui/**"
      - ".github/workflows/spike-gpui.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-targets:
    name: build-only ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
        working-directory: spikes/gpui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --profile minimal
          rustc --version --verbose
      - name: Show tool availability (diagnostic)
        run: |
          which clang || echo "clang: not found"
          xcrun --find metal || echo "metal: not found"
        continue-on-error: true
      - name: Build-only (compile check; nothing is run or uploaded)
        run: cargo build --release --locked --target "${{ matrix.target }}"
