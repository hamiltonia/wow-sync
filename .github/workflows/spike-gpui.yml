name: spike-gpui

# Build-only feasibility spikes (run-001 S-gpui on crates.io 0.2.2; run-002 R2-pin on a
# pinned Zed release tag). Nothing is run or uploaded.
on:
  workflow_dispatch:
  push:
    paths:
      - "spikes/gpui/**"
      - "spikes/gpui-pin/**"
      - ".github/workflows/spike-gpui.yml"

permissions:
  contents: read

concurrency:
  group: spike-gpui-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-targets:
    name: build-only ${{ matrix.spike }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        spike: [gpui, gpui-pin]
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - aarch64-apple-darwin
          - x86_64-apple-darwin
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    defaults:
      run:
        shell: bash
        working-directory: spikes/${{ matrix.spike }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --profile minimal
          rustc --version --verbose
      - name: Show tool availability (diagnostic)
        run: |
          which clang || echo "clang: not found"
          xcrun --find metal || echo "metal: not found"
        continue-on-error: true
      - name: Build-only (compile check; nothing is run or uploaded)
        run: cargo build --release --locked --target "${{ matrix.target }}"
